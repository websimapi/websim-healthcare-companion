<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Healthcare Companion</title>
    <link rel="stylesheet" href="styles.css">
    <script type="importmap">
    {
        "imports": {
            "pitchfinder": "https://cdn.jsdelivr.net/npm/pitchfinder@2.3.2/dist/pitchfinder.min.js"
        }
    }
    </script>
</head>
<body>
    <div class="container">
        <div class="healthcare-robot">
            <div class="robot-body">
                <div class="robot-face">
                    <div class="eyes">
                        <div class="eye left"></div>
                        <div class="eye right"></div>
                    </div>
                    <div class="mouth"></div>
                </div>
            </div>
        </div>
        
        <div class="controls">
            <div class="status-area">
                <div id="status-message">I'm here to help you. Please speak to me.</div>
                <div id="user-identity">User: Unknown</div>
            </div>
            <button id="start-btn" class="control-btn">Start Listening</button>
            <button id="stop-btn" class="control-btn" disabled>Stop Listening</button>
        </div>
        
        <div class="conversation-log">
            <h3>Conversation History</h3>
            <div id="conversation-container"></div>
        </div>
    </div>

    <script src="voice-detection.js"></script>
    <script src="memory-manager.js"></script>
    <script src="tts-service.js"></script>
    <script src="llm-service.js"></script>
    <script src="main.js"></script>

</body>
</html>
